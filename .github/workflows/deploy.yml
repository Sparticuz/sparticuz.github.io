# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy Quartz site to Github Pages

# Run when there is a push to this repo, or a workflow dispatch from my vault repo
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out this repo
      - uses: actions/checkout@v7

      # Setup node for this repo
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Checkout Quartz, putting it in the `quartz` subdirectory
      - uses: actions/checkout@v7
        with:
          repository: "jackyzha0/quartz"
          ref: v5.0.0
          path: quartz

      # Checkout my Vault into quartz/content
      # If it's a private repo, make sure to add the deploy key
      - name: Checkout Obsidian repo
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.VAULTREPO }}
          path: quartz/content
          ssh-key: ${{ secrets.NOTESPRIVATEKEY }}

      # Apply configuration and dependency locks before installing Quartz
      - name: Copy Quartz config and overrides
        run: rsync -av overrides/ quartz

      # npm ci on Quartz
      - name: Install Dependencies
        working-directory: ./quartz
        run: npm ci

      - name: Restore Quartz plugins
        working-directory: ./quartz
        run: npx quartz plugin restore

      - name: Check Quartz upgrade regressions
        working-directory: ./quartz
        env:
          TZ: America/New_York
        run: node --test quartz-upgrade.test.mjs

      # Build the Quartz public folder
      - name: Build Quartz
        working-directory: ./quartz
        run: npx quartz build

      # Upload the Quartz public folder as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz/public

  publish:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy the Quartz public folder artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
